name: Bug Report
description: Tell us about a problem on the SSE website.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the SSE website. Please avoid including
        passwords, tokens, or other private information.

  - type: input
    id: affected-page
    attributes:
      label: Affected page
      description: Paste the page URL where you found the problem.
      placeholder: https://sse.rit.edu/...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: Describe the problem and what you saw.
      placeholder: When I ..., the page ...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that reliably shows the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      placeholder: I expected ...
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Choose the browser where you experienced the issue.
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop or laptop
        - Phone
        - Tablet
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots or additional context
      description: Drag screenshots here or add anything else that could help.
